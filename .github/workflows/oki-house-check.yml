name: Oki House prototype checks
on:
  pull_request:
    paths:
      - 'prototypes/oki-house.html'
      - 'prototypes/assets/**'
      - 'tests/oki-house.spec.cjs'
      - 'playwright.house.config.cjs'
      - 'scripts/portal-preview.mjs'
      - 'scripts/oki-house-preview-worker.mjs'
      - 'tests/oki-house-preview.test.mjs'
      - 'gloss-build.mjs'
      - '.github/workflows/oki-house-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Verify preview isolation and production guards offline
        run: node --test tests/oki-house-preview.test.mjs
      - name: Validate standalone page and JS syntax
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const html=readFileSync('site/public/oki-house.html','utf8');
          if(!html.includes('okok-oki-house-v2'))throw Error('Oki House missing');
          if(!html.includes('state.coins-=price'))throw Error('Purchase logic missing');
          if(!html.includes('oki-game.svg'))throw Error('Oki image missing from page');
          const sprite=readFileSync('site/public/oki-game.svg','utf8');
          if(!sprite.includes('<svg')||!sprite.includes('viewBox'))throw Error('Oki sprite invalid');
          const js=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!js)throw Error('Inline game JS missing');
          writeFileSync('/tmp/oki-house-check.js',js);
          NODE
          node --check /tmp/oki-house-check.js
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise touch layouts and game persistence in both engines
        run: npx playwright test --config=playwright.house.config.cjs --workers=2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oki-house-mobile-reports
          path: |
            quality-reports/house-*.png
            playwright-house-report/
            test-results/
          retention-days: 14
