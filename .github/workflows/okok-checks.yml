name: OK-OK safety checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: okok-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMIT_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify patched Lighthouse consumers offline
        run: node scripts/verify-toolchain.mjs
      - name: Build and enforce project, SEO, PWA and size checks
        run: npm run build
      - name: Check production verification failure detection
        run: node --test tests/live-release.test.mjs tests/release-cache.test.mjs tests/weather-service.test.mjs tests/catalogue-analytics.test.mjs
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check RU/EN/TH phone and tablet layout and offline PWA
        run: npm run test:mobile
      - name: Keep browser and size reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: okok-quality-reports
          path: |
            quality-reports/
            playwright-report/
            test-results/
          retention-days: 14
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMIT_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit the actual generated website three times
        run: npm run audit
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: okok-lighthouse
          path: |
            quality-reports/lighthouse/
            .lighthouseci/
          retention-days: 14

  payment-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/ads-payments.spec.cjs tests/ad-invitation-oki.spec.cjs tests/catalogue-services.spec.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: payment-ui-reports
          path: |
            quality-reports/payment-*.png
            quality-reports/oki-invitation-*.png
            quality-reports/services-*.png
            test-results/
          retention-days: 14
