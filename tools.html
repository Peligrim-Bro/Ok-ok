<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OK-OK Tools</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#071b2b;color:#f0f9ff}*{box-sizing:border-box}body{margin:0;padding:16px 16px max(24px,env(safe-area-inset-bottom))}main{max-width:650px;margin:auto}a{color:#72e6ef}header{display:flex;justify-content:space-between;align-items:center}button{background:#103344;color:white;border:1px solid #456b7c;border-radius:10px;padding:10px 15px;min-height:44px}h1{margin:26px 0 8px}.card{display:block;background:#103344;border:1px solid #3c6477;border-radius:18px;padding:18px;margin:15px 0;text-decoration:none;color:white;min-height:110px}.card strong{display:block;font-size:21px;margin-bottom:8px}.card span{color:#b8d0dc;line-height:1.5}p{color:#bfd0db}</style></head><body><main><header><a href="/">← OK-OK</a><button id="lang">EN</button></header><h1 id="heading">Полезное</h1><p id="intro">Инструменты для поездки. Без регистрации.</p><a class="card" href="./split-bill.html"><strong>OK-OK SPLIT</strong><span id="split">Разделить счёт в кафе: по блюдам или поровну, с налогами и чаевыми.</span></a><a class="card" href="./inspect.html"><strong>OK-OK INSPECT</strong><span id="inspect">Фотоосмотр арендованного байка до и после поездки. PDF с доказательствами.</span></a></main><script>const t={ru:['Полезное','Инструменты для поездки. Без регистрации.','Разделить счёт в кафе: по блюдам или поровну, с налогами и чаевыми.','Фотоосмотр арендованного байка до и после поездки. PDF с доказательствами.'],en:['Tools','Travel tools. No registration.','Split restaurant bills by item or equally, including tax and tips.','Document a rental bike before and after the ride, with photos and PDF.'],th:['เครื่องมือ','เครื่องมือสำหรับการเดินทาง ไม่ต้องสมัครสมาชิก','หารค่าอาหารตามรายการหรือเท่า ๆ กัน รวมภาษีและทิป','บันทึกสภาพรถเช่าก่อนและหลังใช้งาน พร้อมภาพถ่ายและ PDF']};let lang=localStorage.getItem('okok_lang')||'ru';if(!t[lang])lang='ru';function render(){document.documentElement.lang=lang;['heading','intro','split','inspect'].forEach((id,i)=>document.getElementById(id).textContent=t[lang][i]);document.getElementById('lang').textContent=lang==='ru'?'EN':lang==='en'?'TH':'RU'}document.getElementById('lang').onclick=()=>{lang=lang==='ru'?'en':lang==='en'?'th':'ru';localStorage.setItem('okok_lang',lang);render()};render()</script></body></html>
