 и редактура","review":"Источники просмотрены 27.10.2026. Чек-лист и фразы составлены редакцией.","help":"Туристическая полиция · 1155","other":"Другие темы — следующий этап: жильё, счета в барах, обмен.","back":"К ситуациям","loading":"Открыть памятку","checkTitle":"До оплаты","afterTitle":"Что делать сейчас"},"en":{"title":"Stay scam-aware","topic":"Bike rental deposits","lead":"Five checks before paying. Practical steps if a deposit is withheld.","before":"Before renting","after":"Deposit withheld","notice":"Do not leave your original passport as a deposit. Before riding, check the correct licence and insurance coverage.","checks":["Deposit amount and return deadline are written in the contract","Deduction terms and rental contacts are saved","Video of all sides: damage, dashboard and fuel","Existing damage is recorded with the staff member","Contract and payment receipt are saved"],"steps":["Ask for a joint inspection and show your original photos or video.","Ask for the damage, basis for deductions and cost breakdown in writing.","Save your contract, receipt, messages and photos. Write a timeline without publishing personal documents.","If threatened, move to a safe place. Contact Tourist Police: 1155."],"progress":"Checked","reset":"Reset","phrase":"A phrase to use","copy":"Copy English phrase","copied":"Copied","fallback":"Copy failed — select the text manually.","translations":["Ask for the deposit return terms in writing.","Ask for the reason and calculation in writing."],"quiz":"What is the warning sign?","example":"Fictional example: “Send the deposit now; we will do the contract later.”","choices":["Confirm the terms in writing first","Pay now to secure the bike"],"answer":"Pressure to pay before agreeing terms is a reason to pause and check. It does not prove fraud.","share":"Share with a friend","shared":"Link copied","sharefallback":"Copy the link below","report":"Report an experience to the author","reporthint":"Prepare the date, place, short account and evidence. You choose whether to send. Reports are reviewed and do not become public accusations.","disclaimer":"Practical checklist, not a legal opinion. Checkmarks stay on this device and do not verify a rental business.","sources":"Sources and editorial notes","review":"Sources reviewed 27 Oct 2026. Checklist and phrases are editorial suggestions.","help":"Tourist Police · 1155","other":"Next topics: housing, bar bills and currency exchange.","back":"All situations","loading":"Open checklist","checkTitle":"Before paying","afterTitle":"What to do now"},"th":{"title":"รู้ทันก่อนพลาด","topic":"เช่ารถและเงินมัดจำ","lead":"ตรวจ 5 ข้อก่อนจ่าย และขั้นตอนเมื่อถูกหักเงินมัดจำ","before":"ก่อนเช่า","after":"ถูกหักมัดจำ","notice":"อย่าฝากหนังสือเดินทางตัวจริงเป็นเงินประกัน ก่อนขับขี่ ตรวจสอบใบขับขี่และความคุ้มครองประกันภัยให้เหมาะสม","checks":["ระบุจำนวนมัดจำและกำหนดคืนในสัญญา","เก็บเงื่อนไขการหักเงินและช่องทางติดต่อร้าน","ถ่ายวิดีโอรอบรถ รอยเสียหาย หน้าปัด และน้ำมัน","บันทึกรอยเดิมร่วมกับพนักงาน","เก็บสัญญาและหลักฐานชำระเงิน"],"steps":["ขอตรวจรถร่วมกันและแสดงภาพหรือวิดีโอก่อนเช่า","ขอรายละเอียดความเสียหาย เหตุผลการหักเงิน และรายการค่าใช้จ่ายเป็นลายลักษณ์อักษร","เก็บสัญญา ใบเสร็จ ข้อความ และภาพ เรียงลำดับเหตุการณ์โดยไม่เผยแพร่เอกสารส่วนตัว","หากถูกข่มขู่ ให้ไปยังที่ปลอดภัยและติดต่อตำรวจท่องเที่ยว 1155"],"progress":"ตรวจแล้ว","reset":"ล้างรายการ","phrase":"ประโยคสำหรับพูดคุย","copy":"คัดลอกภาษาอังกฤษ","copied":"คัดลอกแล้ว","fallback":"คัดลอกไม่สำเร็จ โปรดเลือกข้อความเอง","translations":["จะคืนมัดจำเมื่อไรและมีเงื่อนไขอย่างไร ขอระบุในสัญญาได้ไหม","โปรดชี้แจงเหตุผลการหักเงินและรายการค่าใช้จ่ายเป็นลายลักษณ์อักษร"],"quiz":"อะไรคือสัญญาณเตือน?","example":"ตัวอย่างสมมติ: “โอนมัดจำเดี๋ยวนี้ สัญญาค่อยทำทีหลัง”","choices":["ขอเงื่อนไขเป็นลายลักษณ์อักษรก่อน","โอนทันทีเพื่อจองรถ"],"answer":"การเร่งให้จ่ายก่อนตกลงเงื่อนไขเป็นเหตุให้หยุดตรวจสอบ แต่ยังไม่ใช่หลักฐานการฉ้อโกง","share":"ส่งให้เพื่อน","shared":"คัดลอกลิงก์แล้ว","sharefallback":"คัดลอกลิงก์ด้านล่าง","report":"แจ้งประสบการณ์กับผู้จัดทำ","reporthint":"เตรียมวันที่ สถานที่ เรื่องราวโดยย่อและหลักฐาน คุณเป็นผู้เลือกส่ง ข้อมูลจะได้รับการตรวจสอบ ไม่ใช่การกล่าวหาต่อสาธารณะ","disclaimer":"รายการช่วยตรวจสอบทั่วไป ไม่ใช่ความเห็นทางกฎหมาย เครื่องหมายถูกอยู่เฉพาะบนอุปกรณ์นี้ ไม่ใช่การรับรองร้านเช่า","sources":"แหล่งข้อมูลและบันทึก","review":"ตรวจแหล่งข้อมูล 27 ต.ค. 2026 รายการและประโยคเป็นข้อเสนอแนะจากบรรณาธิการ","help":"ตำรวจท่องเที่ยว · 1155","other":"หัวข้อถัดไป: ที่พัก บิลในบาร์ และการแลกเงิน","back":"ทุกสถานการณ์","loading":"เปิดรายการตรวจสอบ","checkTitle":"ก่อนจ่ายเงิน","afterTitle":"ขั้นตอนต่อไป"}};
const lang=['ru','en','th'].includes(new URLSearchParams(location.search).get('lang'))?new URLSearchParams(location.search).get('lang'):'ru',t=DATA[lang];document.getElementById('centre').textContent={ru:'Не Ведись: тренажёр и база схем',en:'Stay Scam-Aware: practice & patterns',th:'รู้ทันกลโกง: แบบฝึกและรูปแบบกลโกง'}[lang];document.getElementById('centre').href='/ne-vedis/index.html?lang='+lang;document.documentElement.lang=lang;document.title='OK-OK · '+t.topic;
const phrases=['When and under what conditions will you return my deposit? Could you put this in the contract?','Please explain the reason for withholding my deposit and provide a written cost breakdown.'];
const root=document.getElementById('guide');let mode=parent.location.hash.endsWith('/after')?'after':'before',saved=[];try{saved=JSON.parse(localStorage.getItem('okok-bike-checks-v1')||'[]');if(!Array.isArray(saved))saved=[]}catch{};
function send(type,extra={}){if(parent!==window)parent.postMessage({okokSafety:type,...extra},parent.location.origin)}
function size(){send('height',{height:Math.ceil(document.body.getBoundingClientRect().height)})}
function draw(){root.innerHTML=`<span class="eyebrow">${t.title}</span><h1><span aria-hidden="true">🛵</span> ${t.topic}</h1><p class="lead">${t.lead}</p><p class="notice">${t.notice}</p><div class="modes"><button data-mode="before" aria-pressed="${mode==='before'}">${t.before}</button><button data-mode="after" aria-pressed="${mode==='after'}">${t.after}</button></div><section class="panel" aria-labelledby="mode-title"><div class="checklist-head"><h2 id="mode-title">${mode==='before'?t.checkTitle:t.afterTitle}</h2>${mode==='before'?`<span id="progress" aria-label="${t.progress}" aria-live="polite"></span><button id="reset">${t.reset}</button>`:''}</div>${mode==='before'?t.checks.map((x,i)=>`<label><input type="checkbox" data-check="${i}" ${saved.includes(i)?'checked':''}>${x}</label>`).join(''):'<ol>'+t.steps.map(x=>'<li>'+x+'</li>').join('')+`</ol><a class="button" href="tel:1155">${t.help}</a>`}</section><p class="fineprint">${t.disclaimer}</p><section class="panel"><h2>${t.phrase}</h2><textarea id="phrase" readonly aria-label="English">${phrases[mode==='before'?0:1]}</textarea><p>${t.translations[mode==='before'?0:1]}</p><button id="copy">${t.copy}</button></section><details class="panel"><summary>${t.quiz}</summary><p>${t.example}</p><div class="row">${t.choices.map((x,i)=>`<button data-answer="${i}">${x}</button>`).join('')}</div><p id="answer" role="status"></p></details><div class="row"><button id="share">${t.share}</button><button id="report">${t.report}</button></div><p class="fineprint">${t.reporthint}</p><p id="status" role="status"></p><p id="sharelink" hidden></p><details class="panel"><summary>${t.sources}</summary><p>${t.review}</p><p><a href="https://www.smartraveller.gov.au/destinations/asia/thailand" target="_blank" rel="noopener">Smartraveller · Thailand</a></p><p><a href="https://www.touristpolice.go.th/en" target="_blank" rel="noopener">Tourist Police Thailand · 1155</a></p></details><p class="muted">${t.other}</p>`;
root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw();send('mode',{mode})});
function progress(){if(document.getElementById('progress'))document.getElementById('progress').textContent=saved.length+' / '+t.checks.length}progress();
root.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{saved=[...root.querySelectorAll('[data-check]:checked')].map(x=>Number(x.dataset.check));try{localStorage.setItem('okok-bike-checks-v1',JSON.stringify(saved))}catch{}progress()});
if(document.getElementById('reset'))document.getElementById('reset').onclick=()=>{saved=[];try{localStorage.removeItem('okok-bike-checks-v1')}catch{}draw()};
root.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{document.getElementById('answer').textContent=t.answer;root.querySelectorAll('[data-answer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));size()});
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('phrase').value);status(t.copied);send('copy',{mode})}catch{document.getElementById('phrase').focus();document.getElementById('phrase').select();status(t.fallback)}};
document.getElementById('share').onclick=async()=>{const url='https://ok-ok.click/?utm_source=share&utm_medium=guide&utm_campaign=bike_deposit#safety/bike-deposit';try{if(navigator.share)await navigator.share({title:t.topic,url});else{await navigator.clipboard.writeText(url);status(t.shared)}send('share')}catch(e){if(e.name!=='AbortError'){const box=document.getElementById('sharelink');box.hidden=false;box.textContent=url;status(t.sharefallback)}}};
document.getElementById('report').onclick=()=>{if(parent!==window)send('report');else location.href='https://ok-ok.click/#safety/bike-deposit'};size();}
function status(text){document.getElementById('status').textContent=text;size()}
try{const sync=()=>{document.documentElement.dataset.theme=parent.document.documentElement.dataset.theme||'dark';size()};new MutationObserver(sync).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']});sync()}catch{};
new ResizeObserver(size).observe(document.body);draw();if(parent.location.hash.endsWith('/quiz')){root.querySelector('details').open=true;root.querySelector('details').scrollIntoView();}
</script></body></html>
