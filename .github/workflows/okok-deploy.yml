name: OK-OK deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: okok-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMIT_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website and Cloudflare Worker
        run: node gloss-build.mjs && node telegram-build.mjs
      - name: Verify generated scripts and critical features
        run: node scripts/verify-project.mjs
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
      - name: Deploy directly to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-telegram.json
      - name: Check public website and API health
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const local = readFileSync('site/public/index.html', 'utf8');
          const checks = [
            ['/', async r => {
              const html = await r.text();
              if (!html.includes('PattayaOK')) throw new Error('Website title missing');
              if (local.includes('HAF8KW') && !html.includes('HAF8KW')) throw new Error('Latest Klook code missing');
            }],
            ['/api/telegram/health', async r => {
              const data = await r.json();
              if (data.service !== 'okok-telegram' || data.configured !== true) throw new Error('Telegram health check failed');
            }],
            ['/api/oki/health', async r => {
              const data = await r.json();
              if (data.service !== 'okok-oki-metrics' || data.configured !== true) throw new Error('OKI health check failed');
            }]
          ];
          for (const [path, verify] of checks) {
            let passed = false;
            for (let attempt = 0; attempt < 4; attempt++) {
              try {
                const url = new URL(path, 'https://ok-ok.click');
                url.searchParams.set('deployment-check', process.env.COMMIT_REF + '-' + attempt);
                const response = await fetch(url, { headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(15000) });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                await verify(response);
                passed = true;
                console.log('OK ' + path);
                break;
              } catch (error) {
                console.error(path + ': ' + error.message);
                if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
            if (!passed) process.exit(1);
          }
          NODE
