name: Bounded diagnostics (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Diagnostic target'
        required: true
        type: choice
        options:
          - toolchain
          - build

permissions:
  contents: read

concurrency:
  group: bounded-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run selected diagnostics (no fixes, no deployment)
        env:
          DIAGNOSTIC_TARGET: ${{ inputs.target }}
        run: |
          case "$DIAGNOSTIC_TARGET" in
            toolchain) node scripts/verify-toolchain.mjs ;;
            build) npm run build ;;
            *) echo "Unsupported target" >&2; exit 2 ;;
          esac
      - name: Write run summary
        if: always()
        run: |
          echo '### Bounded diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo 'Manual, read-only run; no autonomous fixes or deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect failed step logs for the concrete blocker.' >> "$GITHUB_STEP_SUMMARY"
