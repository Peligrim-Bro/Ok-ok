<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OK-OK SPLIT</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b0f19;color:#f1f5f9}*{box-sizing:border-box}body{margin:0;padding:0 14px max(28px,env(safe-area-inset-bottom))}main{max-width:540px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}a{color:#67e8f9}h1{font-size:22px;margin:12px 0}.card{background:#121826;border:1px solid #304051;border-radius:17px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}input,button,select{font:inherit;border-radius:10px;border:1px solid #475569;background:#0f172a;color:white;padding:11px;min-height:44px}input[type=number]{width:120px}input[type=text]{flex:1;min-width:130px}button{cursor:pointer}button.active,.primary{background:#06b6d4;color:#06121b;font-weight:700;border-color:#06b6d4}.muted{color:#a9b6c8;font-size:13px}.danger{color:#fda4af}.item{padding:10px 0;border-bottom:1px solid #344153}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{min-height:36px;padding:6px 9px;font-size:13px}.chips .chosen{border-color:#06b6d4;color:#67e8f9;background:#164052}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}#total{font-size:25px;color:#67e8f9;font-weight:800}#notice{color:#fcd34d}label{font-size:14px}summary{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #67e8f9}#equal,#warning{display:none}
</style></head><body><main>
<header><a href="/">← <span data-t="home">На главную</span></a><div class="row"><button id="lang">EN</button><button id="reset" aria-label="Reset">↻</button></div></header>
<h1>OK-OK SPLIT</h1><div class="row"><button id="itemsMode" class="active" data-t="itemsMode">По блюдам</button><button id="equalMode" data-t="equalMode">Поровну</button></div>
<section id="equal" class="card"><label data-t="amount">Сумма до надбавок, ฿</label><div><input id="equalAmount" type="number" min="0" max="1000000" step=".01" inputmode="decimal"></div><p data-t="guests">Гостей</p><div class="row"><button id="minus">−</button><strong id="count">2</strong><button id="plus">+</button></div></section>
<div id="itemMode"><section class="card"><h2 data-t="people">Участники</h2><div class="row"><input id="member" type="text" maxlength="30" placeholder="Имя"><button id="addMember" class="primary">+</button></div><div id="members" class="chips"></div></section>
<section class="card"><h2 data-t="dishes">Блюда</h2><div class="row"><input id="itemName" type="text" maxlength="60" placeholder="Блюдо"><input id="itemPrice" type="number" min=".01" max="1000000" step=".01" inputmode="decimal" placeholder="฿"><button id="addItem" class="primary">+</button></div><p class="muted" data-t="scanNotice">Фото чека: OCR появится после отдельной проверки. Пока ввод вручную.</p><div id="itemList"></div></section></div>
<section class="card"><div class="between"><h2 data-t="fees">Налоги и сборы</h2><select id="taxMode"><option value="excluded">Сверху</option><option value="included">Включены</option></select></div><p class="muted" id="taxHint"></p><div class="row"><label><input id="service" type="checkbox"> Service 10%</label><label><input id="vat" type="checkbox"> VAT 7%</label></div><div class="row"><label><input type="radio" name="formula" value="compound" checked> ×1.10×1.07</label><label><input type="radio" name="formula" value="additive"> +17%</label></div><label data-t="tip">Чаевые</label><select id="tip"><option value="0">0%</option><option value="5">5%</option><option value="10">10%</option><option value="15">15%</option></select></section>
<section class="card"><label data-t="pay">PromptPay / реквизиты (необязательно)</label><input id="pay" type="text" style="width:100%" maxlength="100" autocomplete="off"></section>
<section class="card"><div class="between"><h2 data-t="result">Итого</h2><span id="total">0.00 ฿</span></div><p id="warning"></p><div id="shares"></div><div class="row"><button id="copy" data-t="copy">Копировать</button><button id="telegram" class="primary">Telegram</button></div><p id="status" class="muted" role="status"></p></section>
</main><script type="module">
import {calculateSplitFromUi,formatSatang,validateReceiptPrice} from './tools/split-ui-adapter.mjs';
const $=id=>document.getElementById(id);
const i18n={ru:{home:'На главную',itemsMode:'По блюдам',equalMode:'Поровну',amount:'Сумма до надбавок, ฿',guests:'Гостей',people:'Участники',dishes:'Блюда',fees:'Налоги и сборы',tip:'Чаевые',pay:'PromptPay / реквизиты (необязательно)',result:'Итого',copy:'Копировать',scanNotice:'Фото чека: OCR появится после отдельной проверки. Пока ввод вручную.',unassigned:'Не распределено',included:'Сборы уже включены в цены. Сверху добавляются только чаевые.',excluded:'Выбранные сборы добавляются сверху.',name:'Имя',dish:'Блюдо',invalid:'Проверьте цену и количество гостей',copied:'Скопировано',reset:'Очистить весь счёт?',select:'Выберите гостей для каждого блюда'},en:{home:'Home',itemsMode:'By items',equalMode:'Equally',amount:'Amount before extras, ฿',guests:'Guests',people:'Participants',dishes:'Items',fees:'Taxes and fees',tip:'Tip',pay:'PromptPay / payment details (optional)',result:'Total',copy:'Copy',scanNotice:'Receipt OCR will be added after separate verification. Enter items manually for now.',unassigned:'Unassigned',included:'Fees are already included in prices. Only tips are added.',excluded:'Selected fees are added on top.',name:'Name',dish:'Dish',invalid:'Check the amount and guest count',copied:'Copied',reset:'Clear the whole bill?',select:'Select guests for each item'}};
let lang=localStorage.getItem('okok_lang')==='en'?'en':'ru',mode='items',members=[],items=[],people=2;
const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
function translate(){const t=i18n[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);$('lang').textContent=lang==='ru'?'EN':'RU';$('member').placeholder=t.name;$('itemName').placeholder=t.dish;$('taxMode').options[0].textContent=lang==='ru'?'Сверху':'Add on';$('taxMode').options[1].textContent=lang==='ru'?'Включены':'Included';render();}
function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}
function render(){const t=i18n[lang];$('itemMode').style.display=mode==='items'?'block':'none';$('equal').style.display=mode==='equal'?'block':'none';$('itemsMode').classList.toggle('active',mode==='items');$('equalMode').classList.toggle('active',mode==='equal');$('count').textContent=people;const inc=$('taxMode').value==='included';$('service').disabled=inc;$('vat').disabled=inc;document.querySelectorAll('[name=formula]').forEach(x=>x.disabled=inc);$('taxHint').textContent=inc?t.included:t.excluded;
$('members').replaceChildren();members.forEach(m=>{const b=el('button',m.name+' ×');b.onclick=()=>{members=members.filter(x=>x.id!==m.id);items.forEach(x=>x.assignedIds=x.assignedIds.filter(id=>id!==m.id));render()};$('members').append(b)});
$('itemList').replaceChildren();items.forEach(item=>{const box=el('div','', 'item');const top=el('div','', 'between');top.append(el('strong',item.name),el('span',item.price.toFixed(2)+' ฿'));const remove=el('button','×','danger');remove.setAttribute('aria-label','Remove item');remove.onclick=()=>{items=items.filter(x=>x.id!==item.id);render()};top.append(remove);box.append(top);const chips=el('div','','chips');members.forEach(m=>{const b=el('button',m.name,item.assignedIds.includes(m.id)?'chosen':'');b.setAttribute('aria-pressed',String(item.assignedIds.includes(m.id)));b.onclick=()=>{item.assignedIds=item.assignedIds.includes(m.id)?item.assignedIds.filter(x=>x!==m.id):[...item.assignedIds,m.id];render()};chips.append(b)});box.append(chips);$('itemList').append(box)});
try{const r=calculateSplitFromUi({mode,items,members,vat:$('vat').checked,service:$('service').checked,taxMode:$('taxMode').value,taxFormula:document.querySelector('[name=formula]:checked').value,tipPercent:Number($('tip').value),equalTotal:Number($('equalAmount').value)||0,equalPeople:people});$('total').textContent=formatSatang(r.grandTotal);$('warning').style.display=r.unassignedTotal?'block':'none';$('warning').textContent=r.unassignedTotal?t.unassigned+': '+formatSatang(r.unassignedTotal):'';$('shares').replaceChildren();if(mode==='equal'){r.equalGroups.forEach(g=>$('shares').append(el('p',g.count+' × '+formatSatang(g.amount))))}else members.forEach(m=>{const row=el('div','','between');row.append(el('span',m.name),el('strong',formatSatang(r.shares[m.id]||0)));$('shares').append(row)});$('status').textContent='';}catch(e){$('status').textContent=t.invalid}}
$('itemsMode').onclick=()=>{mode='items';render()};$('equalMode').onclick=()=>{mode='equal';render()};$('lang').onclick=()=>{lang=lang==='ru'?'en':'ru';localStorage.setItem('okok_lang',lang);translate()};$('addMember').onclick=()=>{const name=$('member').value.trim();if(!name||members.some(m=>m.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return;members.push({id:uid(),name});$('member').value='';render()};$('addItem').onclick=()=>{const price=validateReceiptPrice($('itemPrice').value);if(price===null){$('status').textContent=i18n[lang].invalid;return}items.push({id:uid(),name:$('itemName').value.trim()||i18n[lang].dish,price,assignedIds:members.map(m=>m.id)});$('itemName').value='';$('itemPrice').value='';render()};$('minus').onclick=()=>{people=Math.max(1,people-1);render()};$('plus').onclick=()=>{people=Math.min(1000,people+1);render()};['equalAmount','taxMode','service','vat','tip'].forEach(id=>$(id).addEventListener('input',render));document.querySelectorAll('[name=formula]').forEach(e=>e.addEventListener('change',render));
function summary(){const lines=['OK-OK SPLIT',i18n[lang].result+': '+$('total').textContent];$('shares').querySelectorAll('div,p').forEach(x=>lines.push(x.textContent));if($('warning').style.display==='block')lines.push($('warning').textContent);if($('pay').value.trim())lines.push('PromptPay: '+$('pay').value.trim());return lines.join('\n')}
$('copy').onclick=async()=>{const text=summary();try{await navigator.clipboard.writeText(text);$('status').textContent=i18n[lang].copied}catch{window.prompt('Copy:',text)}};
$('telegram').onclick=()=>{const url='https://t.me/share/url?url=&text='+encodeURIComponent(summary());window.location.href=url};
$('reset').onclick=()=>{if(!confirm(i18n[lang].reset))return;members=[];items=[];people=2;mode='items';['member','itemName','itemPrice','equalAmount','pay'].forEach(id=>$(id).value='');$('vat').checked=false;$('service').checked=false;$('taxMode').value='excluded';$('tip').value='0';document.querySelector('[name=formula][value=compound]').checked=true;render()};translate();
</script></body></html>
