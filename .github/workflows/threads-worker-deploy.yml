name: Deploy OK-OK Threads Worker
on:
  push:
    branches: [main, ops/threads-worker-deploy]
    paths:
      - '.github/workflows/threads-worker-deploy.yml'
      - 'workers/threads-auth/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: okok-threads-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[deploy threads]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check workers/threads-auth/worker.mjs
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          command: deploy --config workers/threads-auth/wrangler.json
      - name: Check the deployed callback and Threads token
        run: |
          endpoint=https://okok-threads-auth.timurhansolo.workers.dev
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$endpoint/callback")" = 400
          curl -sS "$endpoint/threads-check" | jq -e '.ok == true'
      - name: Publish the approved Last Passenger teaser
        if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[publish last passenger]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          wrangler() {
            npx --yes wrangler@4.151.3 "$@" --config workers/threads-auth/wrangler.json
          }
          cleanup() {
            wrangler secret delete THREADS_PUBLISH_KEY
          }
          trap cleanup EXIT
          printf '%s' "$key" | wrangler secret put THREADS_PUBLISH_KEY
          endpoint=https://okok-threads-auth.timurhansolo.workers.dev
          body="$(mktemp)"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --max-time 40 -X POST \
              -H "Authorization: Bearer $key" -o "$body" -w '%{http_code}' "$endpoint/publish-teaser")"
            if [[ "$status" != 404 || "$(cat "$body")" != "Not found" ]]; then
              break
            fi
            sleep 5
          done
          cat "$body"
          test "$status" = 200
          result="$(cat "$body")"
          jq -e '.id | type == "string"' <<< "$result"
