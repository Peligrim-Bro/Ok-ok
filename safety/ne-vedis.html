const CASES=[{"id":"passport","category":"travel","icon":"🛵","title":{"ru":"Паспорт за байк","en":"Passport as a deposit","th":"ใช้พาสปอร์ตเป็นมัดจำ"},"question":{"ru":"В прокате просят оставить оригинал паспорта: «Он будет в сейфе».","en":"A rental shop asks to keep your original passport: “It will be in our safe.”","th":"ร้านเช่าขอเก็บพาสปอร์ตตัวจริง โดยบอกว่าจะเก็บในตู้เซฟ"},"options":[{"ru":"Оставить: сотрудник обещает сохранность","en":"Leave it: the staff promises to keep it safe","th":"ฝากไว้ เพราะพนักงานรับรองว่าปลอดภัย"},{"ru":"Сохранить паспорт у себя и обсудить другие условия или другой прокат","en":"Keep your passport and discuss other terms or another provider","th":"เก็บพาสปอร์ตไว้กับตัว และคุยเงื่อนไขอื่นหรือหาร้านใหม่"}],"correct":1,"explanation":{"ru":"Паспорт даёт прокату рычаг давления при споре. Smartraveller рекомендует не оставлять его как залог. До оплаты обсуди договор и условия возврата депозита.","en":"Keeping your passport can give a rental shop leverage in a dispute. Smartraveller advises against leaving it as a guarantee. Agree on the contract and deposit terms before paying.","th":"การฝากพาสปอร์ตทำให้ร้านมีอำนาจต่อรองเมื่อมีข้อพิพาท Smartraveller แนะนำไม่ให้ใช้เป็นหลักประกัน ควรตกลงสัญญาและเงื่อนไขคืนมัดจำก่อนจ่าย"},"source":0},{"id":"damage","category":"travel","icon":"🧾","title":{"ru":"Новая царапина?","en":"A new scratch?","th":"รอยใหม่จริงหรือ?"},"question":{"ru":"При возврате байка требуют оплатить повреждение. У тебя есть видео до аренды.","en":"At return, the shop demands payment for damage. You have a video from before the rental.","th":"ตอนคืนรถ ร้านเรียกค่าเสียหาย คุณมีวิดีโอก่อนเช่า"},"options":[{"ru":"Перевести деньги немедленно, чтобы быстрее уйти","en":"Pay immediately to leave faster","th":"โอนทันทีเพื่อจะได้ไปเร็ว ๆ"},{"ru":"Сопоставить видео и договор, запросить описание повреждения и расчёт","en":"Compare the video and contract; ask for the damage details and cost breakdown","th":"เทียบวิดีโอกับสัญญา และขอรายละเอียดความเสียหายกับการคำนวณค่าใช้จ่าย"}],"correct":1,"explanation":{"ru":"Сохрани договор, оплату, переписку и исходное видео. Спор о повреждении сам по себе не доказывает мошенничество. Не обостряй конфликт; при необходимости обратись в туристическую полицию через контакты памятки.","en":"Keep the contract, payment record, messages and original video. A damage dispute alone does not prove fraud. Avoid confrontation; use the guide’s Tourist Police contact if needed.","th":"เก็บสัญญา หลักฐานจ่ายเงิน แชต และวิดีโอต้นฉบับ ข้อพิพาทเรื่องความเสียหายอย่างเดียวไม่ได้พิสูจน์ว่าเป็นการโกง หลีกเลี่ยงการเผชิญหน้า และใช้ข้อมูลติดต่อตำรวจท่องเที่ยวในคู่มือหากจำเป็น"},"source":0},{"id":"seed","category":"digital","icon":"🔐","title":{"ru":"«Поддержка» просит 12 слов","en":"“Support” asks for 12 words","th":"“ฝ่ายช่วยเหลือ” ขอ 12 คำ"},"question":{"ru":"В личку пишет «поддержка кошелька»: для разблокировки нужны слова восстановления.","en":"A “wallet support” account messages you: they need your recovery phrase to unlock the wallet.","th":"บัญชีที่อ้างว่าเป็นฝ่ายช่วยเหลือกระเป๋าเงินทักมาขอวลีกู้คืนเพื่อปลดล็อก"},"options":[{"ru":"Отправить только часть слов","en":"Send only some of the words","th":"ส่งไปแค่บางคำ"},{"ru":"Не передавать слова и открыть поддержку самостоятельно через официальный сервис","en":"Share no words; open support yourself through the official service","th":"ไม่ส่งคำใด ๆ และเปิดฝ่ายช่วยเหลือผ่านบริการทางการด้วยตัวเอง"}],"correct":1,"explanation":{"ru":"Фраза восстановления и приватный ключ дают доступ к активам. Не передавай их собеседнику и не вводи по присланной ссылке. Логотип и имя аккаунта не подтверждают личность.","en":"A recovery phrase or private key gives access to assets. Do not share it or enter it through a link someone sent. An account name and logo do not verify identity.","th":"วลีกู้คืนหรือคีย์ส่วนตัวใช้เข้าถึงสินทรัพย์ได้ อย่าส่งให้ผู้ที่ติดต่อมา หรือกรอกผ่านลิงก์ที่ส่งมา ชื่อกับโลโก้บัญชียืนยันตัวตนไม่ได้"},"source":1},{"id":"prize","category":"digital","icon":"🎁","title":{"ru":"Приз с предоплатой","en":"A prize with an upfront fee","th":"รางวัลที่ต้องจ่ายก่อน"},"question":{"ru":"Сообщение обещает выигрыш, но сначала нужно оплатить «активацию».","en":"A message promises a prize, but first you must pay an “activation fee”.","th":"ข้อความบอกว่าคุณได้รางวัล แต่ต้องจ่าย “ค่าเปิดใช้งาน” ก่อน"},"options":[{"ru":"Оплатить небольшую сумму ради большого приза","en":"Pay a small fee for a big prize","th":"จ่ายนิดเดียวเพื่อรับรางวัลใหญ่"},{"ru":"Остановиться и проверить предложение независимо от отправителя","en":"Stop and verify the offer independently of the sender","th":"หยุดและตรวจสอบข้อเสนอผ่านช่องทางอื่นที่ไม่ใช่ผู้ส่ง"}],"correct":1,"explanation":{"ru":"Требование заплатить, чтобы получить приз, — характерный признак обмана. Не отправляй деньги и данные под давлением. Отсутствие найденных жалоб не означает безопасность.","en":"Being asked to pay to receive a prize is a common scam sign. Do not send money or personal details under pressure. Finding no complaints does not establish safety.","th":"การขอให้จ่ายเงินเพื่อรับรางวัลเป็นสัญญาณกลโกงที่พบบ่อย อย่าส่งเงินหรือข้อมูลเมื่อถูกกดดัน การไม่พบคำร้องเรียนไม่ได้ยืนยันว่าปลอดภัย"},"source":2}];
