name: Image optimization experiment
on:
  push:
    branches:
      - experiment/image-optimization-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without changing lockfile
        run: npm install --no-package-lock
      - name: Build with optimized image copies
        run: npm run build:optimized
      - name: Verify site regressions
        run: npm run check
      - name: Record optimization statistics
        if: always()
        shell: bash
        run: |
          mkdir -p image-optimization-report
          if [ -d site/public/assets/optimized ]; then
            find site/public/assets/optimized -type f -name '*.webp' | sort > image-optimization-report/generated-files.txt
            du -sh site/public/assets/optimized > image-optimization-report/size.txt
          else
            echo 'No optimized directory produced' > image-optimization-report/size.txt
            touch image-optimization-report/generated-files.txt
          fi
          echo "WebP copies: $(wc -l < image-optimization-report/generated-files.txt)" | tee -a image-optimization-report/size.txt
          cat image-optimization-report/size.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload optimization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-optimization-report
          path: image-optimization-report/
          retention-days: 7
