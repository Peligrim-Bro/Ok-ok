name: OK-OK deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: okok-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMIT_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build website and Cloudflare Worker
        run: node gloss-build.mjs && node telegram-build.mjs
      - name: Verify generated site
        run: |
          node scripts/verify-project.mjs
          grep -q 'okok-pulse-v1' site/public/index.html
          grep -q 'oki-nav-float-fix-v4' site/public/index.html
          grep -q 'oki-prompt-tail-fix-v4' site/public/index.html
          grep -q 'okok-tetris-playable-v2' site/public/index.html
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy directly to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-telegram.json
      - name: Verify the published source version, shell, PWA and health endpoints
        run: node scripts/verify-live.mjs
      - name: Keep live release verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: okok-live-release
          path: quality-reports/live-release.json
          if-no-files-found: ignore
          retention-days: 14
